name: Registration read-only diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/registration-diagnostic.yml']
permissions:
  contents: write
concurrency:
  group: ns360-registration-diagnostic
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe anonymous GET receipt without submitting personal data
        run: |
          python3 - <<'PY'
          import json, re, secrets, time, urllib.request, urllib.error, urllib.parse
          from pathlib import Path
          from datetime import datetime, timezone
          source = Path('library-gate.js').read_text(encoding='utf-8')
          endpoint = re.search(r"const WEB_APP_URL = '([^']+)'", source).group(1)
          assert urllib.parse.urlsplit(endpoint).hostname == 'script.google.com'
          callback = 'NS360_RC_diagnostic20261114'
          params = {'action': 'receipt', 'id': 'v7-' + secrets.token_hex(20), 'callback': callback}
          url = endpoint + '?' + urllib.parse.urlencode(params)
          started = time.monotonic()
          result = {'checked_at': datetime.now(timezone.utc).isoformat(), 'method': 'GET', 'no_lead_submitted': True}
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 NS360ReadOnlyDiagnostic', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(req, timeout=35) as res:
                  body = res.read(500000).decode('utf-8', errors='replace')
                  result.update(http_status=res.status, content_type=res.headers.get('Content-Type', ''), final_host=urllib.parse.urlsplit(res.url).hostname)
              match = re.fullmatch(re.escape(callback) + r'\((.*)\);?\s*', body.strip(), re.S)
              lower = body.lower()
              if match:
                  payload = json.loads(match.group(1))
                  result.update(classification='RECEIPT_JSONP_OK', received_boolean=isinstance(payload.get('ok'), bool), saved=payload.get('ok'))
              elif 'accounts.google.com' in str(result.get('final_host')) or 'servicelogin' in lower:
                  result['classification'] = 'AUTH_OR_GOOGLE_LOGIN_HTML'
              elif 'unable to open' in lower or 'file you have requested' in lower or 'sorry, unable' in lower:
                  result['classification'] = 'GOOGLE_FILE_ERROR_HTML'
              elif 'script function not found' in lower:
                  result['classification'] = 'APPS_SCRIPT_FUNCTION_MISSING'
              elif '<html' in lower or '<!doctype' in lower:
                  result['classification'] = 'HTML_INSTEAD_OF_JSONP_POSSIBLY_OLD_DEPLOYMENT'
              else:
                  result['classification'] = 'UNEXPECTED_RESPONSE'
          except urllib.error.HTTPError as exc:
              result.update(classification='HTTP_ERROR', http_status=exc.code)
          except Exception as exc:
              result.update(classification='TRANSPORT_ERROR', exception_type=type(exc).__name__)
          result['elapsed_seconds'] = round(time.monotonic() - started, 2)
          # No response bodies, personal data, request IDs, or tokens in the report.
          Path('REGISTRATION_DIAGNOSTIC_RESULT.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          note = '\n\n### Registration diagnostic 2026-11-14 - read-only runtime probe\n'
          note += '- User reports native signup cannot confirm registration on both mobile and desktop.\n'
          note += '- Live Sheet read in chat found only headers in Leads!I1:J50; no Sheet writes were made.\n'
          note += '- Anonymous GET receipt probe from GitHub Actions (no POST, no fake lead): ' + result['classification'] + '.\n'
          note += '- Evidence: REGISTRATION_DIAGNOSTIC_RESULT.json and KIEM_TRA_DANG_KY_20261114.md.\n'
          note += '- Native flag remains OFF; successful anonymous receipt does not establish browser POST or Android success.\n'
          for name in ('CONG_VIEC_DANG_LAM.md', 'TRANG_THAI_DU_AN.md'):
              with Path(name).open('a', encoding='utf-8') as out:
                  out.write(note)
          PY
      - name: Preserve diagnostic results and append project checkpoints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REGISTRATION_DIAGNOSTIC_RESULT.json CONG_VIEC_DANG_LAM.md TRANG_THAI_DU_AN.md
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint: anonymous registration receipt diagnostic, no lead submission'
            git push origin HEAD:main
          fi
